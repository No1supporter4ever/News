<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新聞閱讀與生字庫 (News Reader & Vocab Bank)</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tesseract.js for OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <!-- QRCode.js for generating QR codes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- HTML5-QRCode for scanning QR codes -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- pinyin-pro for Mandarin Pinyin with tone marks -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.3/dist/index.js"></script>

  <!-- OpenCC JS for Simplified to Traditional Chinese conversion -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2hk.js"></script>

  <style>
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background-color: #f8fafc;
    }
    .selectable-text {
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    /* Rainbow Highlighting Classes */
    mark.hl-yellow  { background-color: #fef08a; color: #854d0e; padding: 2px 4px; border-radius: 4px; }
    mark.hl-green   { background-color: #bbf7d0; color: #166534; padding: 2px 4px; border-radius: 4px; }
    mark.hl-cyan    { background-color: #a5f3fc; color: #155e75; padding: 2px 4px; border-radius: 4px; }
    mark.hl-blue    { background-color: #bfdbfe; color: #1e40af; padding: 2px 4px; border-radius: 4px; }
    mark.hl-purple  { background-color: #e9d5ff; color: #6b21a8; padding: 2px 4px; border-radius: 4px; }
    mark.hl-pink    { background-color: #fbcfe8; color: #9d174d; padding: 2px 4px; border-radius: 4px; }
    mark.hl-orange  { background-color: #fed7aa; color: #9a3412; padding: 2px 4px; border-radius: 4px; }
    mark.hl-red     { background-color: #fecaca; color: #991b1b; padding: 2px 4px; border-radius: 4px; }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Top Header Navigation -->
  <header class="bg-brand-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-white text-brand-700 p-2 rounded-xl shadow-inner font-bold text-xl">
          <i class="fa-solid fa-newspaper"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg md:text-xl leading-tight">兒童新聞學習閱讀器</h1>
          <p class="text-xs text-brand-200">News Reader & Vocab Bank</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <!-- Scan QR Button -->
        <button onclick="openScannerModal()" class="px-3 py-2 bg-brand-800 hover:bg-brand-900 rounded-lg text-sm flex items-center space-x-1 border border-brand-500 shadow-sm transition">
          <i class="fa-solid fa-qrcode"></i>
          <span class="hidden sm:inline">掃瞄 QR Code</span>
        </button>

        <!-- Navigation Tabs -->
        <nav class="flex bg-brand-800 p-1 rounded-xl">
          <button id="nav-news-btn" onclick="switchTab('news')" class="px-3 py-1.5 rounded-lg text-sm font-medium transition bg-white text-brand-800 shadow">
            <i class="fa-solid fa-book-open mr-1"></i>新聞列表
          </button>
          <button id="nav-words-btn" onclick="switchTab('words')" class="px-3 py-1.5 rounded-lg text-sm font-medium transition text-brand-200 hover:text-white">
            <i class="fa-solid fa-bookmark mr-1"></i>生字庫 <span id="vocab-badge-count" class="bg-brand-500 text-white text-xs px-1.5 py-0.5 rounded-full ml-1">0</span>
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6">

    <!-- TAB 1: NEWS LIST & READER -->
    <section id="tab-news" class="space-y-6">
      
      <!-- Top Actions Bar -->
      <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <!-- Filters -->
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">篩選：</span>
          <select id="filter-lang" onchange="renderNewsList()" class="bg-slate-100 text-sm rounded-lg px-3 py-2 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
            <option value="all">全部語言 (All)</option>
            <option value="zh">繁體中文 (Chinese)</option>
            <option value="en">英文 (English)</option>
          </select>

          <select id="filter-cat" onchange="renderNewsList()" class="bg-slate-100 text-sm rounded-lg px-3 py-2 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
            <option value="all">全部分類 (All)</option>
          </select>

          <select id="filter-read" onchange="renderNewsList()" class="bg-slate-100 text-sm rounded-lg px-3 py-2 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
            <option value="all">全部狀態 (Status)</option>
            <option value="unread">未閱讀 (Unread)</option>
            <option value="read">已閱讀 (Read)</option>
          </select>
        </div>

        <!-- Add News Button -->
        <button onclick="openUploadModal()" class="bg-brand-600 hover:bg-brand-700 text-white font-medium px-4 py-2 rounded-xl text-sm flex items-center justify-center space-x-2 shadow-sm transition">
          <i class="fa-solid fa-plus"></i>
          <span>新增新聞 / 上傳報紙照片</span>
        </button>
      </div>

      <!-- News Cards Grid -->
      <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- News items rendered dynamically -->
      </div>
    </section>

    <!-- TAB 2: VOCABULARY & PHRASE BANK -->
    <section id="tab-words" class="hidden space-y-6">
      <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        
        <!-- Header & Category Switch -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-slate-100">
          <div>
            <h2 class="text-xl font-bold text-slate-800">生字與短語庫 (Vocabulary & Phrases)</h2>
            <p class="text-xs text-slate-500">複習已儲存的單字與短語，提供廣東話及普通話發音</p>
          </div>

          <!-- Type Switch (Vocab vs Phrase) -->
          <div class="flex bg-slate-100 p-1 rounded-xl self-start">
            <button id="word-type-vocab" onclick="switchWordType('vocab')" class="px-4 py-1.5 rounded-lg text-sm font-semibold transition bg-white text-brand-700 shadow">
              單字 (Vocab)
            </button>
            <button id="word-type-phrase" onclick="switchWordType('phrase')" class="px-4 py-1.5 rounded-lg text-sm font-semibold transition text-slate-600 hover:text-slate-900">
              短語 (Phrases)
            </button>
          </div>
        </div>

        <!-- Sub-Tabs: Mastery Status (In Progress vs Mastered) -->
        <div class="flex items-center justify-between gap-2">
          <div class="flex space-x-2">
            <button id="status-tab-learning" onclick="switchMasteryStatus('learning')" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-brand-100 text-brand-800 border border-brand-200">
              <i class="fa-solid fa-spinner mr-1"></i>學習中 (<span id="count-learning">0</span>)
            </button>
            <button id="status-tab-mastered" onclick="switchMasteryStatus('mastered')" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">
              <i class="fa-solid fa-circle-check text-green-600 mr-1"></i>已學會 (<span id="count-mastered">0</span>)
            </button>
          </div>

          <!-- Filter language -->
          <select id="words-filter-lang" onchange="renderWordBank()" class="bg-slate-100 text-xs rounded-lg px-2.5 py-1.5 border border-slate-200">
            <option value="all">全部語言</option>
            <option value="zh">中文</option>
            <option value="en">英文</option>
          </select>
        </div>

        <!-- Word List Container -->
        <div id="words-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
          <!-- Dynamically rendered word cards -->
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL 1: ADD / UPLOAD NEWS -->
  <div id="upload-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-150">
      
      <!-- Modal Header -->
      <div class="p-4 md:p-5 bg-brand-700 text-white flex justify-between items-center">
        <h3 class="font-bold text-lg flex items-center gap-2">
          <i class="fa-solid fa-file-circle-plus"></i>
          新增新聞文章 / OCR 照片掃瞄
        </h3>
        <button onclick="closeUploadModal()" class="text-white/80 hover:text-white p-1 rounded-lg">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-5 overflow-y-auto flex-1 space-y-4">
        
        <!-- Language & Category Input -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">文章語言 (Language)</label>
            <select id="input-news-lang" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-brand-500">
              <option value="zh">繁體中文 (Traditional Chinese)</option>
              <option value="en">英文 (English)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">新聞分類 (Category)</label>
            <div class="flex gap-2">
              <input id="input-news-cat" type="text" list="existing-categories" placeholder="例：科學、生活、體育" class="flex-1 bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-brand-500">
              <datalist id="existing-categories"></datalist>
            </div>
          </div>
        </div>

        <!-- News Title -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">新聞標題 (Title)</label>
          <input id="input-news-title" type="text" placeholder="請輸入新聞標題..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-brand-500">
        </div>

        <!-- Image OCR Upload Box -->
        <div class="border-2 border-dashed border-brand-200 bg-brand-50/50 rounded-2xl p-4 text-center">
          <div class="flex flex-col items-center justify-center space-y-2">
            <i class="fa-solid fa-camera-retro text-brand-500 text-3xl"></i>
            <span class="text-xs font-semibold text-slate-600">上傳報紙/打印照片自動識別文字 (OCR)</span>
            <input type="file" id="ocr-file-input" accept="image/*" class="hidden" onchange="handleImageOCR(event)">
            <button onclick="document.getElementById('ocr-file-input').click()" class="bg-brand-600 hover:bg-brand-700 text-white text-xs px-4 py-2 rounded-xl shadow-sm transition">
              <i class="fa-solid fa-upload mr-1"></i>選擇照片或拍照
            </button>
          </div>

          <!-- OCR Progress Bar -->
          <div id="ocr-status" class="hidden mt-3 text-xs text-brand-700 font-medium space-y-1">
            <p id="ocr-status-text">準備識別文字...</p>
            <div class="w-full bg-brand-200 rounded-full h-2 overflow-hidden">
              <div id="ocr-progress" class="bg-brand-600 h-2 w-0 transition-all duration-200"></div>
            </div>
          </div>
        </div>

        <!-- Content Area -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">新聞內文 (Content)</label>
          <textarea id="input-news-content" rows="8" placeholder="在此貼上、編輯或確認 OCR 識別出的新聞內文..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-brand-500 leading-relaxed"></textarea>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-end space-x-3">
        <button onclick="closeUploadModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-200">取消</button>
        <button onclick="saveNewArticle()" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow-sm transition">
          儲存新聞
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: READER VIEW (READING ARTICLE) -->
  <div id="reader-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4 hidden">
    <div class="bg-white rounded-3xl max-w-4xl w-full h-[95vh] flex flex-col shadow-2xl overflow-hidden">
      
      <!-- Reader Header -->
      <div class="p-4 bg-brand-700 text-white flex items-center justify-between">
        <div class="flex items-center space-x-3 truncate">
          <span id="reader-lang-badge" class="px-2 py-0.5 bg-brand-800 text-brand-200 rounded text-xs font-bold">ZH</span>
          <h3 id="reader-article-title" class="font-bold text-base md:text-lg truncate">新聞標題</h3>
        </div>

        <div class="flex items-center space-x-2">
          <!-- Text size adjustment -->
          <button onclick="changeFontSize(-2)" class="p-1.5 bg-brand-800 hover:bg-brand-900 rounded-lg text-xs" title="縮小字體">A-</button>
          <button onclick="changeFontSize(2)" class="p-1.5 bg-brand-800 hover:bg-brand-90
